proxy_cache_path /var/cache/nginx/fuyouxuan_benefits
    levels=1:2 keys_zone=benefits_cache:32m max_size=256m inactive=30m use_temp_path=off;

map $http_authorization $seckill_user_key {
    ""      "ip:$binary_remote_addr";
    default "token:$http_authorization";
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;
limit_req_zone $seckill_user_key zone=seckill_user_limit:10m rate=1r/s;
limit_req_status 429;

upstream fuyouxuan_backend {
    least_conn;
    server app-1:8080 max_fails=3 fail_timeout=30s;
    server app-2:8080 max_fails=3 fail_timeout=30s;
    keepalive 100;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ^~ /api/voucher/list/ {
        limit_req zone=api_limit burst=400 nodelay;
        proxy_cache benefits_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 10s;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Fuyouxuan-Cache $upstream_cache_status always;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://fuyouxuan_backend;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/voucher-order/seckill/ {
        limit_req zone=seckill_user_limit burst=2 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://fuyouxuan_backend;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/ {
        limit_req zone=api_limit burst=400 nodelay;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://fuyouxuan_backend;
        include /etc/nginx/proxy_params;
        add_header X-Fuyouxuan-Cache BYPASS always;
    }
}
